<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>COLMAP Points Loader</title>
</head>
<body>
  <h1>Load COLMAP points</h1>

  <form id="form">
    <label>
      Directory:
      <input id="directory" type="text" size="60" placeholder="/path/to/colmap/run" required />
    </label>
    <button type="submit">Load</button>
  </form>

  <p>Status: <span id="status">idle</span></p>
  <pre id="details"></pre>

  <hr>

  <h2>Annotate by 3D Point ID</h2>
  <form id="annotate-form">
    <label>
      Point ID:
      <input id="point-id" type="number" step="1" placeholder="e.g., 12345" required />
    </label>
    <button type="submit">Annotate</button>
  </form>

  <p>Annotate status: <span id="annotate-status">idle</span></p>
  <ul id="annotate-list"></ul>
  <pre id="annotate-raw"></pre>

  <script>
    // same-origin
    const BASE_URL = "";

    // --- loading bits (existing) ---
    const statusEl = document.getElementById("status");
    const detailsEl = document.getElementById("details");
    const form = document.getElementById("form");
    const dirInput = document.getElementById("directory");
    let pollTimer = null;

    function setStatus(text, data) {
      statusEl.textContent = text;
      detailsEl.textContent = data ? JSON.stringify(data, null, 2) : "";
    }

    async function ping(directory) {
      try {
        const url = `${BASE_URL}/load_points?directory=${encodeURIComponent(directory)}`;
        const res = await fetch(url, { method: "GET" });
        const data = await res.json();
        setStatus(data.status || "unknown", data);

        if (data.status === "ready" || data.status === "error" || data.status === "idle") {
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = null;
        }
      } catch (err) {
        setStatus("network-error", { error: String(err) });
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const directory = dirInput.value.trim();
      if (!directory) return;

      ping(directory);
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => ping(directory), 1000);
    });

    // --- annotate bits (new) ---
    const annotateForm = document.getElementById("annotate-form");
    const pointIdInput = document.getElementById("point-id");
    const annotateStatusEl = document.getElementById("annotate-status");
    const annotateListEl = document.getElementById("annotate-list");
    const annotateRawEl = document.getElementById("annotate-raw");

    function setAnnotateStatus(text, data) {
      annotateStatusEl.textContent = text;
      annotateRawEl.textContent = data ? JSON.stringify(data, null, 2) : "";
    }

    function renderOutputs(outputs) {
      annotateListEl.innerHTML = "";
      for (const item of outputs) {
        const li = document.createElement("li");
        li.textContent = `image_id=${item.image_id}  name=${item.image_name}`;
        annotateListEl.appendChild(li);
      }
    }

    annotateForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pid = pointIdInput.value.trim();
      if (!pid) return;

      setAnnotateStatus("working...", null);
      annotateListEl.innerHTML = "";

      try {
        const url = `${BASE_URL}/annotate_point?pointID=${encodeURIComponent(pid)}`;
        const res = await fetch(url, { method: "GET" });
        const data = await res.json();

        setAnnotateStatus(data.status || (data.ok ? "ok" : "error"), data);

        if (data.ok && data.status === "annotated") {
          renderOutputs(data.outputs || []);
        }
      } catch (err) {
        setAnnotateStatus("network-error", { error: String(err) });
      }
    });
  </script>
</body>
</html>
